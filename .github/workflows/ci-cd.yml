name: Pipeline CI/CD - MLOps Fire Risk

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Récupérer le code du dépôt (Checkout)
      uses: actions/checkout@v4

    - name: 2. Configurer Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 3. Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    - name: 4. Exécuter les tests unitaires avec Pytest
      run: |
        pytest

    - name: 5. Tester la construction de l'image Docker
      run: |
        docker build -t fire-risk-mlops:latest .